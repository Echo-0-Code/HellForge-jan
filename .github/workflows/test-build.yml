# Echo-0-Code's test builds of the fork's dev branch (the always up-to-date testing branch): the package, as the nightly
# builds it, for a tester to install. Upstream's nightly does not run on a fork, so this one builds each push to dev.
name: Test build

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build:
    name: Build the package
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Test builds run no tests (ci.yml runs on pull requests and dev only), so the cheap checks that caught real drift
      # run here: the app's SDK version against hellforge_mod.h (SDK 51/52 mods were refused for it), and the lint.
      - name: SDK version matches the header
        shell: pwsh
        run: |
          $header = [regex]::Match((Get-Content -Raw native/mod-sdk/hellforge_mod.h), '#define HF_MOD_SDK_VERSION (\d+)').Groups[1].Value
          $app = [regex]::Match((Get-Content -Raw src/HellForge.Core/Mods.cs), 'SdkVersion = (\d+);').Groups[1].Value
          if (-not $header -or $header -ne $app) { throw "Mods.cs SdkVersion $app does not match hellforge_mod.h HF_MOD_SDK_VERSION $header." }
          "SDK $header in both"
      - name: Structure lint
        shell: pwsh
        run: python scripts/lint/lint.py check --warnings-as-errors
      - uses: ./.github/actions/build-tools
        with:
          native: 'true'
      - name: scripts/Package-HellForge.ps1
        shell: pwsh
        run: |
          $env:TEMP = $env:TMP = (New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'artifacts/tmp')).FullName
          ./scripts/Package-HellForge.ps1 -SteamExports data/steam-export-manifest.json
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: test-package
          path: |
            artifacts/package/HellForge-Setup.exe
            native/**/hellforge_modloader.dll
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
