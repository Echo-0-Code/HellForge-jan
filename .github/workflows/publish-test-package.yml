# Publishes an existing test-package artifact as a pre-release, so it can be fetched where only GitHub release
# downloads are reachable. Rewritten for each build by ai-shared scripts/cloud/publish-test.sh.
name: Publish test package

on:
  push:
    branches: [ci/publish-test-package]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the artifact and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "45771218988"
          TAG: "test-366022b"
          TARGET: "366022bbcc66e134baec61813786d63db1f21022"
          TITLE: "Test build 366022b, CUSTOMIZE class line for mods items (run 45771218988)"
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n test-package -D pkg
          find pkg -type f -exec ls -la {} \;
          cp "$(find pkg -name HellForge-Setup.exe | head -1)" HellForge-Setup.exe
          sha256sum HellForge-Setup.exe | tee SHA256SUMS
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --target "$TARGET" \
            --title "$TITLE" --notes "test-package artifact of run $RUN_ID, republished for download." \
            HellForge-Setup.exe SHA256SUMS
