# Publishes an existing test-package artifact as a pre-release, so it can be fetched where only GitHub release
# downloads are reachable. Pushed by the "Combine weapons into one mod" thread on 20 Nov, with Jan's approval.
name: Publish test package

on:
  push:
    branches: [ci/publish-test-package]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the artifact and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '45285285705'
          TAG: test-dac15d3
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n test-package -D pkg
          find pkg -type f -exec ls -la {} \;
          cp "$(find pkg -name HellForge-Setup.exe | head -1)" HellForge-Setup.exe
          sha256sum HellForge-Setup.exe | tee SHA256SUMS
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --target dac15d31f064f41d4556c1602e27ec4076a5a7a9 \
            --title "Test build dac15d3, test-a72e796 + armory bitmap fix for mods' records (PR #56) (run $RUN_ID)" --notes "test-package artifact of run $RUN_ID, republished for download." \
            HellForge-Setup.exe SHA256SUMS
